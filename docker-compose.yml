services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - db_data:/app/data
    environment:
      - NODE_ENV=development
      - DB_PATH=/app/data/tsuri-navi.db
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    ports:
      - "5001:5000"
    volumes:
      - osrm_data:/data
    command: >
      osrm-routed
      --algorithm mld
      --max-table-size 10000
      /data/japan-latest.osrm
    restart: unless-stopped

volumes:
  db_data:
  osrm_data:
