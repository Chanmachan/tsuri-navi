name: TsuriNavi
options:
  bundleIdPrefix: com.tsuri-navi
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  swift: "6.0"

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TsuriNavi:
    type: application
    platform: iOS
    sources:
      - path: TsuriNavi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tsuri-navi.app
        INFOPLIST_FILE: TsuriNavi/Info.plist
    info:
      path: TsuriNavi/Info.plist
      properties:
        CFBundleDisplayName: 釣りナビ
        CFBundleName: TsuriNavi
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "自宅位置の取得に使用します"
        NSLocationAlwaysAndWhenInUseUsageDescription: "自宅位置の取得に使用します"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
